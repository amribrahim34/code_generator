# Laravel Code Generator Configuration

# General settings
output_directory: "./output"
indent_size: 4

# Naming conventions
naming:
  model: "PascalCase"
  controller: "PascalCase"
  migration: "snake_case"
  table: "snake_case"

# File extensions
extensions:
  php: ".php"
  migration: ".php"

# Namespaces
namespaces:
  model: "App\\Models"
  controller: "App\\Http\\Controllers"
  request: "App\\Http\\Requests"
  resource: "App\\Http\\Resources"
  repository: "App\\Repositories"

# Database
database:
  engine: "mysql"
  charset: "utf8mb4"
  collation: "utf8mb4_unicode_ci"

# Generators to use
generators:
  - model
  - controller
  - migration
  - request
  - resource
  - repository
  - repository_interface

# Customizations for specific generators
model:
  use_soft_deletes: true
  timestamps: true
  fillable_attributes: true

controller:
  use_repository: true
  use_form_requests: true

migration:
  use_big_integers: true

repository:
  include_custom_methods: false

# Relationship settings
relationships:
  use_inverse_relations: true
  generate_pivot_tables: true

# Laravel version
laravel_version: "8.x"

# Additional features
features:
  generate_api_routes: true
  generate_factories: true
  generate_seeders: true
  use_uuid: false
