<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Our Platform</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background-color: #4caf50;
        color: white;
        text-align: center;
        padding: 20px;
      }
      .content {
        background-color: #f4f4f4;
        padding: 20px;
      }
      .button {
        display: inline-block;
        padding: 10px 20px;
        background-color: #4caf50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Welcome to Our Platform!</h1>
      </div>
      <div class="content">
        <h2>Hello, {{ username }}!</h2>
        <p>
          We're thrilled to have you on board. Your account has been
          successfully created.
        </p>
        <p>To get started, click the button below to log in:</p>
        <p><a href="{{ login_url }}" class="button">Log In</a></p>
        <p>
          If you have any questions, feel free to reply to this email. We're
          here to help!
        </p>
        <p>Best regards,<br />The Team</p>
      </div>
    </div>
  </body>
</html>
